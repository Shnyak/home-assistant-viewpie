fullscreen:
  name: Fullscreen camera
  description: Show one camera full-screen and optionally return to grid.
  fields:
    camera:
      required: true
      selector:
        text:
    duration:
      required: false
      selector:
        number:
          min: 10
          max: 3600
          unit_of_measurement: seconds
          mode: box
    entry_id:
      required: false
      advanced: true
      selector:
        text:

switch_panel:
  name: Switch panel
  description: Activate a configured panel.
  fields:
    panel:
      required: true
      selector:
        text:
    entry_id:
      required: false
      advanced: true
      selector:
        text:

set_spacing:
  name: Set spacing
  description: Change the divider thickness between camera tiles.
  fields:
    spacing:
      required: true
      selector:
        number:
          min: 0
          max: 20
          unit_of_measurement: px
          mode: slider
    entry_id:
      required: false
      advanced: true
      selector:
        text:

manage_camera:
  name: Manage camera
  description: Add, update, or delete a camera. On deletion, cells using it are cleared in all panels and Viewpie config is reloaded.
  fields:
    operation:
      required: true
      selector:
        select:
          options:
            - create
            - update
            - delete
    name:
      required: true
      selector:
        text:
    url:
      required: false
      description: RTSP URL. Required for create and update.
      selector:
        text:
    fullscreen_url:
      required: false
      description: Optional alternate RTSP URL for full-screen mode.
      selector:
        text:
    decoder:
      required: false
      default: auto
      description: Per-camera decode preference. Hardware falls back to software if hardware decoding fails.
      selector:
        select:
          options:
            - auto
            - hardware
            - software
    entry_id:
      required: false
      advanced: true
      selector:
        text:

test_camera:
  name: Test camera
  description: Test RTSP reachability for a configured camera. The result is returned to the visual editor.
  fields:
    name:
      required: true
      selector:
        text:
    entry_id:
      required: false
      advanced: true
      selector:
        text:

manage_panel:
  name: Manage panel
  description: Create, update, or delete a panel. Layout is a newline-separated grid of viewport slot IDs; viewports is a list of slot/feed mappings.
  fields:
    operation:
      required: true
      selector:
        select:
          options:
            - create
            - update
            - delete
    panel_id:
      required: true
      selector:
        text:
    name:
      required: false
      selector:
        text:
    layout:
      required: false
      selector:
        text:
    viewports:
      required: false
      description: YAML/JSON list, for example [{"slot":"a","feeds":["yard"]}]
      selector:
        object:
    entry_id:
      required: false
      advanced: true
      selector:
        text:

reorder_panels:
  name: Reorder panels
  description: Persist the display order of every configured Viewpie panel.
  fields:
    order:
      required: true
      description: Complete ordered list of panel IDs, with every panel included exactly once.
      selector:
        object:
    entry_id:
      required: false
      advanced: true
      selector:
        text:
