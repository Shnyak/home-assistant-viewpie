name: Validate integration

on:
  pull_request:
  push:
    branches:
      - main
      - feat/camera-entities-and-management

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Compile Python files
        run: python -m compileall -q custom_components
      - name: Validate JSON and YAML files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          for path in Path("custom_components").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
              print(f"Valid JSON: {path}")
          for path in Path("custom_components").rglob("*.yaml"):
              yaml.safe_load(path.read_text(encoding="utf-8"))
              print(f"Valid YAML: {path}")
          PY
