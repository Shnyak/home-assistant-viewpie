fullscreen:
  name: Fullscreen camera
  description: Show one camera full-screen and optionally return to grid.
  fields:
    camera:
      required: true
      selector:
        text:
    duration:
      required: false
      selector:
        number:
          min: 10
          max: 3600
          unit_of_measurement: seconds
          mode: box
    entry_id:
      required: false
      advanced: true
      selector:
        text:

switch_panel:
  name: Switch panel
  description: Activate a configured panel.
  fields:
    panel:
      required: true
      selector:
        text:
    entry_id:
      required: false
      advanced: true
      selector:
        text:

set_spacing:
  name: Set spacing
  description: Change the divider thickness between camera tiles.
  fields:
    spacing:
      required: true
      selector:
        number:
          min: 0
          max: 20
          unit_of_measurement: px
          mode: slider
    entry_id:
      required: false
      advanced: true
      selector:
        text:

manage_camera:
  name: Manage camera
  description: Add, update, or delete a camera in the running Viewpie instance. Deletion is rejected by Viewpie while panels still use the camera.
  fields:
    operation:
      required: true
      selector:
        select:
          options:
            - create
            - update
            - delete
    name:
      required: true
      selector:
        text:
    url:
      required: false
      description: RTSP URL. Required for create and update.
      selector:
        text:
    fullscreen_url:
      required: false
      description: Optional alternate RTSP URL for full-screen mode.
      selector:
        text:
    entry_id:
      required: false
      advanced: true
      selector:
        text:

test_camera:
  name: Test camera
  description: Test RTSP reachability for a configured camera and write the result to the integration log.
  fields:
    name:
      required: true
      selector:
        text:
    entry_id:
      required: false
      advanced: true
      selector:
        text:

manage_panel:
  name: Manage panel
  description: Create, update, or delete a panel. Layout is a newline-separated grid of viewport slot IDs; viewports is a list of slot/feed mappings.
  fields:
    operation:
      required: true
      selector:
        select:
          options:
            - create
            - update
            - delete
    panel_id:
      required: true
      selector:
        text:
    name:
      required: false
      selector:
        text:
    layout:
      required: false
      selector:
        text:
    viewports:
      required: false
      description: YAML/JSON list, for example [{"slot":"a","feeds":["yard"]}]
      selector:
        object:
    entry_id:
      required: false
      advanced: true
      selector:
        text:
