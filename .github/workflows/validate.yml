name: Validate integration and publish stable release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML pytest pytest-homeassistant-custom-component pytest-socket
      - name: Compile Python files
        run: python -m compileall -q custom_components
      - name: Run integration regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q
      - name: Validate JSON and YAML files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          for path in Path("custom_components").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
              print(f"Valid JSON: {path}")
          for path in Path("custom_components").rglob("*.yaml"):
              yaml.safe_load(path.read_text(encoding="utf-8"))
              print(f"Valid YAML: {path}")
          PY

  publish-stable:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: static-checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish stable GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import json; print(json.load(open("custom_components/viewpie/manifest.json"))["version"])')"
          TAG="v${VERSION}"
          gh release create "${TAG}" \
            --target "${GITHUB_SHA}" \
            --title "Viewpie Home Assistant integration ${TAG}" \
            --notes "Stable test release. Validate on Home Assistant with the matching Viewpie fork version."
