name: Validate integration and publish preview releases

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Compile Python files
        run: python -m compileall -q custom_components
      - name: Validate JSON and YAML files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          for path in Path("custom_components").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
              print(f"Valid JSON: {path}")
          for path in Path("custom_components").rglob("*.yaml"):
              yaml.safe_load(path.read_text(encoding="utf-8"))
              print(f"Valid YAML: {path}")
          PY

  publish-preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: static-checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump patch version
        id: version
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("custom_components/viewpie/manifest.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          parts = manifest["version"].split(".")
          if len(parts) != 3 or not all(part.isdigit() for part in parts):
              raise SystemExit(f"Expected numeric MAJOR.MINOR.PATCH version, got {manifest['version']!r}")
          parts[2] = str(int(parts[2]) + 1)
          version = ".".join(parts)
          manifest["version"] = version
          path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
          print(f"Prepared preview version {version}")
          PY
      - name: Commit version and publish prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/viewpie/manifest.json
          git commit -m "chore: bump preview version to ${TAG}"
          git tag "${TAG}"
          git push origin "HEAD:main" "${TAG}"
          gh release create "${TAG}" \
            --prerelease \
            --title "Viewpie HA integration ${TAG} (preview)" \
            --notes "Automated preview release from main after successful validation."
