name: Build Marketplace logo assets

on:
  push:
    branches:
      - fix/marketplace-logo-scale-v1.2.2
    paths:
      - scripts/crop_brand_icon.py
      - .github/workflows/build-marketplace-logo.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/marketplace-logo-scale-v1.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install pillow
      - run: python scripts/crop_brand_icon.py
      - name: Commit generated logo assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/viewpie/brand/logo.png custom_components/viewpie/brand/logo@2x.png
          if git diff --cached --quiet; then
            echo "Marketplace logo assets are already current"
            exit 0
          fi
          git commit -m "Add trimmed Marketplace logo assets"
          git push
